<style>
/* Colores de cris: blanco de fondo, negro en letras, dorado en detalles, verde en lo más chico.
   El dorado nunca va como texto sobre blanco: no se leería. */
:root{
  --fondo:#fff;--tinta:#0b0b0b;--oro:#c6a15b;--verde:#183d32;
  --plata:#f4f3f0;--gris:#5e5e5e;--linea:#e4e1da;
  --acento:#0b0b0b;--sobre-acento:#fff;
  --letra:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --muelle:cubic-bezier(.22,1,.36,1);
  /* Espacios: todo sale de esta escala */
  --e1:4px;--e2:8px;--e3:12px;--e4:16px;--e5:24px;--e6:32px;--e7:48px;--e8:64px;--e9:96px;--e10:128px;
  /* Teléfono */
  --flor-ini:30%;--flor-fin:52%;--margen:var(--e4);--entre-secciones:var(--e8);--tras-portada:var(--e6);--hueco:var(--e3);--radio:14px;
  --t-portada:32px;--t-gancho:17px;--t-seccion:28px;--t-cat:44px;--t-nombre:17px;--t-sub:13px;--t-mini:12px;
  --alto-barra:84px;--logo:60px;--ella-ancho:104px;--ella-alto:104px;--ancho-letras:300px;--cierre-alto:190px;--mar:96px;--t-kit:40px;--kit-foto:72px;
}
@media (min-width:1024px){
  :root{
    /* PC: sus propios tamaños, no los del teléfono agrandados */
    --flor-ini:40%;--flor-fin:62%;--margen:var(--e7);--entre-secciones:var(--e10);--tras-portada:var(--e7);--hueco:var(--e5);--radio:18px;
    --t-portada:56px;--t-gancho:21px;--t-seccion:44px;--t-cat:96px;--t-nombre:19px;--t-sub:14px;--t-mini:13px;
    --alto-barra:120px;--logo:84px;--ella-ancho:136px;--ella-alto:136px;--ancho-letras:480px;--cierre-alto:260px;--mar:136px;--t-kit:64px;--kit-foto:96px;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html{background:var(--fondo)}
#app{position:relative;z-index:1}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 17px/1.4 var(--letra);letter-spacing:-.022em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
img{display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

.modo-editar{position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:var(--e3);min-height:52px;padding:0 var(--margen);background:var(--verde);color:#fff;font-size:15px}
.modo-editar b{font-weight:600}
.modo-editar button{min-height:44px;color:#fff;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.demo{padding:7px 16px;background:var(--verde);color:#fff;font:400 15px/1.3 Marcellus,var(--letra);letter-spacing:.015em;text-align:center}
.pagina{max-width:600px;margin:0 auto;padding-block:0 calc(var(--e9) + env(safe-area-inset-bottom));padding-left:max(var(--margen),env(safe-area-inset-left,0px));padding-right:max(var(--margen),env(safe-area-inset-right,0px))}
.barra{display:flex;align-items:center;justify-content:space-between;height:var(--alto-barra)}
.logo{position:relative;flex:none;display:grid;place-items:center;width:var(--logo);height:var(--logo);overflow:hidden;border-radius:calc(var(--logo)*.27);background:var(--tinta);color:var(--oro);font-size:calc(var(--logo)*.5);font-weight:600}
.logo img,.foto-ella img,.marco img{width:100%;height:100%;object-fit:cover}
.logo.con-imagen{background:none;border-radius:0;overflow:visible}
.logo.con-imagen img{object-fit:contain}
.icono{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--linea);color:var(--verde)}
.icono svg{width:20px;height:20px}
.barra-der{display:flex;align-items:center;gap:var(--e2)}
.reservar{display:grid;place-items:center;min-height:44px;padding:0 var(--e4);border-radius:22px;background:var(--tinta);color:#fff;font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.reservar.apagado{background:#fff;color:var(--verde)}

/* Portada: foto centrada, nombre, frase y aviso */
.portada{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--e2);margin-top:var(--e2)}
.editar-sec{align-self:center;margin-left:auto;min-height:44px;padding:0 var(--e4);border-radius:22px;background:var(--plata);font-size:15px;font-weight:500;letter-spacing:-.01em;transition:transform .25s var(--muelle),background .15s}
.editar-sec:active{transform:scale(.96)}
.barra .logo{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.barra .logo img{pointer-events:none}
.foto-ella{flex:none;display:block;width:var(--ella-ancho);height:var(--ella-alto);margin-bottom:var(--e2);overflow:hidden;border-radius:50%;background:var(--plata);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--oro)}
.nombre{text-wrap:balance;font-size:var(--t-portada);line-height:1.08;font-weight:600;letter-spacing:-.035em}
.l{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.l>span{display:inline-block}
.gancho{font-size:var(--t-gancho);line-height:1.3}
.aviso{font-size:var(--t-mini);line-height:1.35;letter-spacing:-.01em;color:var(--gris)}

/* Secciones */
.seccion{position:relative;margin-top:var(--entre-secciones);padding-top:var(--e4)}
.seccion::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:var(--oro)}
.portada+.seccion{margin-top:var(--tras-portada)}
.sec-cab{display:flex;align-items:baseline;justify-content:space-between;gap:var(--e3);margin-bottom:var(--e4)}
.sec-cab h2{font-size:var(--t-seccion);line-height:1.1;font-weight:600;letter-spacing:-.03em}
.marco{display:block;overflow:hidden;border-radius:var(--radio);background:var(--plata)}
.pieza{display:block;position:relative;width:100%;text-align:left;transition:transform .3s var(--muelle)}
.pieza:active{transform:scale(.97)}
.pieza .marco{aspect-ratio:4/5}
.pieza img{transition:transform .9s var(--muelle)}
.pieza b{display:block;margin-top:var(--e3);font-size:var(--t-nombre);font-weight:600;line-height:1.2;letter-spacing:-.022em}
.pieza .sub{display:block;margin-top:2px;font-size:var(--t-sub);letter-spacing:-.01em;color:var(--verde)}
.pieza .marca{position:absolute;left:var(--e2);top:var(--e2);z-index:1;padding:5px 10px;border-radius:14px;background:var(--tinta);box-shadow:0 0 0 1px rgba(255,255,255,.28);color:var(--oro);font-size:12px;font-weight:500;letter-spacing:-.01em}
/* Sin foto: tarjeta de marca, para que un producto con solo el link ya se vea bien */
.sin-foto{display:grid;place-items:center;width:100%;height:100%;background:var(--tinta);color:var(--oro);font-size:40px;font-weight:600}
.sin-foto img{width:46%;height:auto;max-height:62%;object-fit:contain}
.v-carrusel .marco .sin-foto img{transform:none}
/* Varias fotos: se pasan con el dedo */
.marco.varias{position:relative;touch-action:pan-y}
.marco.amazon{background:#fff}
.marco.amazon img{object-fit:contain}
.tira{display:flex;width:100%;height:100%;transition:transform .45s var(--muelle);will-change:transform}
.tira img{flex:0 0 100%;min-width:0;pointer-events:none;-webkit-user-select:none;user-select:none}
.v-carrusel .marco .tira img{transform:none}
.pieza:has(.tira):active{transform:none}
.flecha{display:none}
@media (hover:hover) and (pointer:fine){
  .flecha{position:absolute;top:50%;left:var(--e2);display:grid;place-items:center;width:36px;height:36px;margin-top:-18px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--tinta);opacity:0;transition:opacity .2s;cursor:pointer}
  .flecha.der{left:auto;right:var(--e2)}
  .flecha svg{width:18px;height:18px}
  .flecha.der svg{transform:rotate(180deg)}
  .marco:hover .flecha{opacity:1}
}

.v-carrusel{display:flex;gap:var(--hueco);overflow-x:auto;margin:0 calc(var(--margen)*-1);padding:0 var(--margen) var(--e1);scroll-snap-type:x mandatory;scroll-padding-left:var(--margen);scrollbar-width:none;overscroll-behavior-x:contain}
.v-carrusel::-webkit-scrollbar{display:none}
.v-carrusel>*{flex:0 0 78%;scroll-snap-align:start}
.v-carrusel .marco{transform:scale(var(--z,1));transform-origin:0 100%}
.v-carrusel .marco img{transform:scale(1.12) translateX(var(--px,0))}
.avance{height:2px;margin-top:var(--e4);background:var(--linea);border-radius:2px;overflow:hidden}
.avance i{display:block;height:100%;width:100%;background:var(--oro);transform-origin:0 50%;transform:scaleX(var(--a,.25));transition:transform .2s linear}
.v-cuadricula{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e5) var(--hueco)}
.v-grande{display:grid;gap:var(--e6)}
.v-grande .marco{aspect-ratio:1}

/* Categoría */
.cat-cab{display:grid;gap:var(--e2);margin-bottom:var(--e6)}
.cat-cab .marco{aspect-ratio:5/4;margin-bottom:var(--e3)}
.cat-cab .etiqueta{font-size:13px;font-weight:500;color:var(--verde)}
.cat-cab h1{font-size:var(--t-cat);line-height:1;font-weight:600;letter-spacing:-.04em}
.boton{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;margin-top:10px;border-radius:12px;background:var(--acento);color:var(--sobre-acento);font-size:16px;font-weight:600}
.boton small{font-size:13px;font-weight:400;color:var(--oro)}
.vacio{padding:32px 0;color:var(--gris)}
.fila-video{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;min-height:88px;border-bottom:1px solid var(--oro)}
.fila-video .marco{width:72px;height:72px;border-radius:10px}
.fila-video b{font-size:20px;font-weight:600;line-height:1.15;letter-spacing:-.025em}
.fila-video span{display:block;font-size:13px;color:var(--gris);letter-spacing:-.01em}
.fila-video .sin-foto{display:grid}
.pie{margin-top:var(--e8);padding-top:var(--e4);border-top:1px solid var(--oro);font-size:var(--t-mini);line-height:1.45;letter-spacing:-.01em;color:var(--gris)}
.pie p+p{margin-top:6px}

/* Barra flotante */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:4px;padding:4px;transform:translateX(-50%);border-radius:28px;background:rgba(11,11,11,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.dock button{min-height:48px;padding:0 18px;border-radius:24px;font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s}
.dock button:active{background:rgba(255,255,255,.18)}
.dock .fuerte{background:var(--oro);color:var(--tinta)}
.flechas{display:none}

/* Modo editar */
.editando [data-ed]{cursor:pointer;position:relative}
.editando .nombre,.editando .gancho[data-ed],.editando .logo,.editando .sec-cab h2{box-shadow:0 0 0 2px var(--verde);border-radius:12px}
.editando .reservar{box-shadow:0 0 0 2px var(--verde)}
.editando .foto-ella{box-shadow:0 0 0 2px var(--verde)}
.editando .pieza{animation:temblor .34s ease-in-out infinite alternate}
.editando .caja:nth-child(2n) .pieza{animation-delay:-.17s;animation-direction:alternate-reverse}
.caja{position:relative;min-width:0}
.foto-rapida{position:absolute;right:var(--e2);top:var(--e2);z-index:2;display:flex;align-items:center;gap:4px;min-height:44px;padding:0 12px;border-radius:22px;background:var(--tinta);box-shadow:0 0 0 1px rgba(255,255,255,.28);color:#fff;font-size:14px;font-weight:500;cursor:pointer}
.actualizar-rapido{position:absolute;right:var(--e2);top:calc(var(--e2) + 52px);z-index:2;min-height:44px;padding:0 var(--e3);border-radius:22px;background:var(--oro);color:var(--tinta);font-size:14px;font-weight:600}
.foto-rapida svg{width:18px;height:18px;color:var(--oro)}
.foto-rapida input{position:absolute;width:1px;height:1px;opacity:0}
@keyframes temblor{from{transform:rotate(-.45deg)}to{transform:rotate(.45deg)}}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ctrl button{min-width:44px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--plata);font-size:15px;font-weight:500}
.seccion.oculta{opacity:.45}
.agregar-pieza{display:grid;place-items:center;align-content:center;gap:4px;min-height:190px;width:100%;border:1.5px dashed var(--oro);border-radius:14px;background:#fff;color:var(--verde);font-size:15px;font-weight:500}
.agregar-pieza svg{width:22px;height:22px}

/* Hoja que sube */
.velo{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s}
.velo.abierto{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:50%;bottom:var(--teclado,0px);z-index:31;display:flex;flex-direction:column;width:100%;max-width:520px;max-height:90dvh;transform:translate(-50%,105%);border-radius:22px 22px 0 0;background:#fff;visibility:hidden;transition:transform .55s var(--muelle),visibility 0s .55s}
.hoja.abierta{transform:translate(-50%,0);visibility:visible;transition:transform .55s var(--muelle),visibility 0s}
.asa-hoja{flex:none;display:grid;place-items:center;height:28px;touch-action:none}
.asa-hoja i{width:40px;height:5px;border-radius:3px;background:var(--linea)}
.hoja-cuerpo{overflow-y:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom));display:grid;gap:16px;align-content:start;animation:paso .45s var(--muelle)}
@keyframes paso{from{opacity:0;transform:translateX(24px)}}
.hoja h3{font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.03em}
.hoja .ayuda{font-size:15px;line-height:1.35;color:var(--gris)}
.foto-boton:has([data-foto=entrada]) .marco{background:var(--tinta)}
.foto-boton:has([data-foto=entrada]) img{object-fit:contain}
.campo{display:grid;gap:6px}
.campo label,.rotulo{font-size:15px;font-weight:500}
.campo input,.campo textarea,.campo select{width:100%;min-height:52px;padding:12px 14px;border:0;border-radius:12px;background:var(--plata);font-size:17px}
.campo textarea{min-height:92px;resize:none}
.con-boton{display:grid;grid-template-columns:1fr auto;gap:8px}
.opcion{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;width:100%;min-height:76px;padding:14px;border-radius:14px;background:var(--plata);text-align:left}
.opcion b{display:block;font-size:17px;font-weight:600}
.opcion span{display:block;font-size:14px;line-height:1.3;color:var(--gris)}
.opcion[aria-pressed=true]{box-shadow:0 0 0 2px var(--oro)}
.opcion svg{width:40px;height:40px}
.fijo-abajo{position:sticky;bottom:0;z-index:2;box-shadow:0 0 0 8px #fff}
.primario{width:100%;min-height:52px;border-radius:14px;background:var(--acento);color:var(--sobre-acento);font-size:17px;font-weight:600}
.secundario{min-height:52px;padding:0 16px;border-radius:14px;background:var(--plata);font-size:17px;font-weight:500}
.ancho{width:100%}
.peligro{color:#c4302b}
.opcion-si{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.opcion-si input{width:22px;height:22px;accent-color:var(--tinta)}
.lista-links{display:grid;gap:var(--e2)}
.lista-links:empty{display:none}
.renglon-link{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px;align-items:center}
.renglon-link input{width:100%;min-height:48px;padding:0 var(--e3);border:0;border-radius:12px;background:var(--plata);font-size:16px}
.renglon-link button{display:grid;place-items:center;height:44px;font-size:20px;color:var(--gris)}
.boton-video{display:grid;gap:var(--e1);margin-top:var(--e3)}
.fotos-lista{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--e2)}
.mini{position:relative;aspect-ratio:1;overflow:hidden;border-radius:12px;background:var(--plata)}
.mini>button.elegir{display:block;width:100%;height:100%}
.mini img{display:block;width:100%;height:100%;object-fit:cover}
.mini .portada-et{position:absolute;left:4px;bottom:4px;padding:2px 6px;border-radius:8px;background:var(--tinta);color:#fff;font-size:11px;pointer-events:none}
.mini .x{position:absolute;right:0;top:0;display:grid;place-items:center;width:44px;height:44px}
.mini .x span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(11,11,11,.72);color:#fff;font-size:15px;line-height:1}
.mini.mas{display:grid;place-items:center;color:var(--verde);cursor:pointer}
.mini.mas svg{width:24px;height:24px}
.mini.mas input{position:absolute;width:1px;height:1px;opacity:0}
.auto{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--e3);align-items:center;padding:var(--e3);border-radius:12px;background:var(--plata)}
.auto b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.hoja .auto .ayuda{display:block;margin-top:2px;font-size:13px}
.auto .secundario{background:#fff;white-space:nowrap}
.barrita{grid-column:1/-1;display:block;height:2px;overflow:hidden;background:var(--linea)}
.barrita::after{content:"";display:block;width:40%;height:100%;background:var(--oro);animation:corre 1s var(--muelle) infinite}
@keyframes corre{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.foto-boton{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;min-height:72px;padding:0;border-radius:12px;font-size:17px;font-weight:500;cursor:pointer}
.foto-boton .marco{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;color:var(--gris)}
.foto-boton input{position:absolute;width:1px;height:1px;opacity:0}
.alerta{padding:10px 12px;border-radius:12px;background:#fff4d6;color:#6b4e00;font-size:14px}
.error{font-size:15px;color:#c4302b}
.lista-orden{display:grid}
.renglon{display:grid;grid-template-columns:44px 48px 1fr auto;gap:8px;align-items:center;min-height:64px;background:#fff;border-bottom:1px solid var(--plata)}
.renglon .marco{width:48px;height:48px;border-radius:8px}
.renglon b{font-size:15px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.renglon.arrastrando{position:relative;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.16);border-radius:10px}

/* Kit: foto primero, poco texto y un solo botón para comprar */
.kit-cab{display:grid;gap:var(--e2);margin-bottom:var(--e4)}

.kit-chips [aria-pressed=true]{background:var(--tinta);color:#fff}
.kit-grupo{margin-bottom:var(--e6)}
.kit-grupo h2{margin-bottom:var(--e3);font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.025em}
.kit-filtrado .kit-grupo{margin-bottom:var(--e4)}

.kit-rejilla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e5) var(--e3)}
.kit-grupo.grande .kit-rejilla{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e4) var(--hueco)}

@media (hover:hover) and (pointer:fine){

@media (min-width:1024px){

/* Final de la página: la mariposa vuela y aparece el logo */
.cierre{position:relative;width:var(--ancho-util,100vw);margin:var(--e9) calc(50% - var(--ancho-util,100vw)/2) calc((var(--e9) + env(safe-area-inset-bottom))*-1);padding:var(--cierre-alto) var(--margen) calc(var(--e5) + env(safe-area-inset-bottom));overflow:hidden;background:var(--tinta);color:#bdbdbd;text-align:center}

/* Antes de la entrada: del blanco del navegador al negro, sin corte. Sin JavaScript se quita sola */
.antes{position:fixed;inset:0;z-index:200;background:#fff;animation:antes-sale .3s 7s forwards}

/* Entrada: una sola toma */
.intro.armando .i-letras,.intro.armando .i-iris,.intro.armando .i-logo,.intro.armando .i-aro{visibility:hidden}
@property --barre{syntax:"<angle>";inherits:false;initial-value:360deg}

.i-logo{position:absolute;transform-origin:0 0}

.i-logo .gnb{-webkit-mask-image:conic-gradient(from 200deg at 48% 52%,#000 var(--barre),transparent 0);mask-image:conic-gradient(from 200deg at 48% 52%,#000 var(--barre),transparent 0)}
@keyframes subir{from{opacity:.2;transform:translateY(32px)}}
@supports (animation-timeline:view()){.rev{animation:subir linear both;animation-timeline:view();animation-range:entry 0% entry 30%}}

::view-transition-group(foto-grande){animation-duration:.6s;animation-timing-function:var(--muelle)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

/* PC: otra composición, no el teléfono estirado */
@media (min-width:1024px){

}

<body>
<div class="antes" id="antes" aria-hidden="true"></div>
<div id="app"></div>
<div class="velo" id="velo" data-acc="cerrarHoja"></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" aria-label="Editar"><div class="asa-hoja" id="asa-hoja"><i></i></div><div class="hoja-cuerpo" id="hoja-cuerpo"></div></section>
<div class="nota" id="nota" role="status"></div>

<script>
document.getElementById('fuente').rel = 'stylesheet';
const CLAVE = 'todos-cosas-v1';
const FOTOS = {};
const foto = n => `fotos/${n}.webp`;
const AVISO = 'As an Amazon Associate I earn from qualifying purchases.';
/* Link normal de Amazon: el teléfono lo abre en la app si la tiene. Nada de trucos, para que la compra cuente */
const DESTINO = matchMedia('(pointer:coarse)').matches?'_self':'_blank';
const ICONO = {
  compartir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 7.5 12 3.5 16 7.5M6 11H5v9h14v-9h-1"/></svg>',
  atras:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  mas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  foto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  carro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.1l2-8H6.5"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>',
  lupa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
  asa:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>'
};
const DISENOS = {
  carrusel:{nombre:'Carrusel',texto:'Se desliza de lado.',dibujo:'<svg viewBox="0 0 40 40"><rect x="1" y="8" width="24" height="24" rx="3" fill="#1d1d1f"/><rect x="28" y="8" width="24" height="24" rx="3" fill="#b0b0b5"/></svg>'},
  cuadricula:{nombre:'Dos por dos',texto:'Dos columnas, todo a la vista.',dibujo:'<svg viewBox="0 0 40 40"><rect x="3" y="3" width="16" height="16" rx="3" fill="#1d1d1f"/><rect x="21" y="3" width="16" height="16" rx="3" fill="#1d1d1f"/><rect x="3" y="21" width="16" height="16" rx="3" fill="#1d1d1f"/><rect x="21" y="21" width="16" height="16" rx="3" fill="#1d1d1f"/></svg>'},
  grande:{nombre:'Una grande',texto:'Una foto grande tras otra.',dibujo:'<svg viewBox="0 0 40 40"><rect x="5" y="3" width="30" height="34" rx="3" fill="#1d1d1f"/></svg>'},
  kit:{nombre:'Kit de venta',texto:'Lista para muchos productos, con carrito.',dibujo:'<svg viewBox="0 0 40 40"><rect x="3" y="4" width="9" height="9" rx="2" fill="#1d1d1f"/><rect x="15" y="7" width="22" height="3" rx="1.5" fill="#b0b0b5"/><rect x="3" y="16" width="9" height="9" rx="2" fill="#1d1d1f"/><rect x="15" y="19" width="22" height="3" rx="1.5" fill="#b0b0b5"/><rect x="3" y="28" width="9" height="9" rx="2" fill="#1d1d1f"/><rect x="15" y="31" width="22" height="3" rx="1.5" fill="#b0b0b5"/></svg>'}
};

function ejemplo(){
  /* Demo sin fotos: cada tarjeta espera la foto de ella y se cambia con un toque */
  const p = nombre=>({nombre,foto:'',fotos:[],link:'',ejemplo:true});
  const k = (nombre,grupo,esencial=false)=>({...p(nombre),grupo,esencial});
  return {
    marca:{nombre:'Tu nombre',letra:'M',logo:'',logoEntrada:'',foto:'',gancho:'Las cosas que uso',barra:'Como te ven, te tratan.',boton:{texto:'Reservar',link:'',activo:false}},
    productos:{
      p1:k('Producto 1','Básicos',true),p2:k('Producto 2','Extras'),p3:k('Producto 3','Básicos',true),
      p4:p('Producto 4'),p5:p('Producto 5'),p6:p('Producto 6'),p7:p('Producto 7'),p8:p('Producto 8'),
      k2:k('Producto 9','Básicos',true),k4:k('Producto 10','Extras')
    },
    categorias:{
      kit:{titulo:'Mi kit',foto:'',vista:'kit',productos:['k2','p1','p3','p2','k4']},
      favoritos:{titulo:'Mis favoritos',foto:'',vista:'cuadricula',productos:['p4','p5']},
      ropa:{titulo:'Ropa',foto:'',vista:'grande',productos:['p6','p7']},
      video:{titulo:'Nombre del video',foto:'',vista:'cuadricula',productos:['p8','p5'],inteligente:true,portadaVideos:'',
        anteriores:[{titulo:'Video anterior',foto:'',productos:['p1','p3']}]}
    },
    secciones:[
      {id:'colecciones',titulo:'Colecciones',vista:'carrusel',piezas:[{t:'cat',id:'kit'},{t:'cat',id:'favoritos'},{t:'cat',id:'ropa'}]},
      {id:'destacados',titulo:'Destacados',vista:'cuadricula',piezas:[{t:'cat',id:'video'},{t:'prod',id:'p7'},{t:'prod',id:'p3'},{t:'videos',id:'video'}]}
    ]
  };
}
function cargar(){
  try{
    const d = JSON.parse(localStorage.getItem(CLAVE),(k,v)=>typeof v==='string'&&v.startsWith('foto:')?foto(v.slice(5)):v);
    if(d&&d.marca) return d;
  }catch(e){}
  return ejemplo();
}
/* Las fotos que ya vienen con la página no se copian a la memoria del navegador: solo su nombre */
const nombreDeFoto = new Map(Object.entries(FOTOS).map(([k,v])=>[v,k]));
function guardar(){
  try{localStorage.setItem(CLAVE,JSON.stringify(datos,(k,v)=>typeof v==='string'&&nombreDeFoto.has(v)?`foto:${nombreDeFoto.get(v)}`:v));return true}
  catch(e){avisar('No cupo. Prueba con una foto más liviana.');return false}
}

let datos = cargar();
let editando = false;
let flujo = null;
let pendiente = null;
let ultimoDestino = 's:destacados';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id = () => 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const quieto = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
const cuenta = n => `${n} ${n===1?'producto':'productos'}`;

function transicion(fn){
  if(document.startViewTransition&&!quieto()){
    const t = document.startViewTransition(fn);
    t.ready.catch(()=>{});
    t.finished.catch(()=>{});
  }else fn();
}
function ruta(){
  const [t,a,b] = location.hash.slice(1).split('/').map(x=>{try{return decodeURIComponent(x)}catch(e){return ''}});
  return {t,a,b};
}

/* Lo que ve la gente */
const img = (src,alt='') => src?`<img src="${esc(src)}" alt="${esc(alt)}">`:'';
function logo(){
  const m = datos.marca;
  return `<a class="logo ${m.logo?'con-imagen':''}" href="#" data-ed="logo" aria-label="${esc(m.nombre)}">${m.logo?img(m.logo,m.nombre):esc(m.letra)}</a>`;
}
/* Botón para su app de reservas. Ella pone el link, lo quita o lo vuelve a poner desde Editar */
function botonReserva(){
  const b = datos.marca.boton;
  if(editando) return `<button class="reservar ${b.activo?'':'apagado'}" data-ed="boton">${b.activo?esc(b.texto):'Agregar botón'}</button>`;
  if(!b.activo) return '';
  if(b.link) return `<a class="reservar" href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.texto)}</a>`;
  return CONFIG.demo?`<button class="reservar" data-acc="reservaDemo">${esc(b.texto)}</button>`:'';
}
const barraDerecha = () => `<div class="barra-der">${botonReserva()}<button class="icono" data-acc="compartir" aria-label="Compartir">${ICONO.compartir}</button></div>`;
function lineas(t){

/* Movimiento */
function prepararCarruseles(){
  document.querySelectorAll('.v-carrusel').forEach(c=>{
    const caja = c.closest('.seccion')||c.parentElement;
    const barra = caja.querySelector('.avance');
    caja.classList.toggle('sin-desborde',c.scrollWidth<=c.clientWidth+1);
    const mover = () => {
      const centro = c.getBoundingClientRect().left+c.clientWidth/2;
      [...c.children].forEach(h=>{
        const q = h.getBoundingClientRect();
        const d = caja.classList.contains('sin-desborde')?0:Math.max(-1,Math.min(1,(q.left+q.width/2-centro)/q.width));
        h.style.setProperty('--z',(1-Math.abs(d)*.05).toFixed(3));
        h.style.setProperty('--px',(d*-5).toFixed(2)+'%');
      });
      const max = c.scrollWidth-c.clientWidth;
      if(barra) barra.style.setProperty('--a',(.25+.75*(max>0?c.scrollLeft/max:1)).toFixed(3));
    };
    if(!c.dataset.listo){
      c.dataset.listo = '1';
      let cuadro;
      c.addEventListener('scroll',()=>{cancelAnimationFrame(cuadro);cuadro=requestAnimationFrame(mover)},{passive:true});
    }
    mover();
  });
}
/* Una sola toma: cada escena sale de la anterior y nada se funde.
   Todo son animaciones encima de la página ya pintada: si algo falla, ella sigue en su sitio. */
let cortarEntrada = null;
const ESTRELLAS = [[78.5,5.7,82.8,10],[81.1,8.6,90.4,18.2],[88.9,18.7,92.4,22.2]];
const SUAVE = 'cubic-bezier(.22,1,.36,1)', FIRME = 'cubic-bezier(.76,0,.24,1)', RESORTE = 'cubic-bezier(.34,1.56,.64,1)';
/* La mariposa solo se descarga cuando la gente se acerca al final, así no frena la página.
   Si no llega a tiempo o el aparato pide menos movimiento, el logo aparece igual. */
const VUELO_MS = 4800;
let vigias = [], cierreHecho = false, vueloCierre = null;
const medirAncho = () => document.documentElement.style.setProperty('--ancho-util',`${document.documentElement.clientWidth}px`);
function prepararCierre(){
  medirAncho();
  vigias.forEach(v=>v.disconnect());
  vigias = [];
  const c = $('#cierre');
  if(!c||cierreHecho||quieto()||!window.IntersectionObserver||datos.marca.logoEntrada!==foto('logo-letras-negro')) return;
  const cerca = new IntersectionObserver(l=>{
    if(!l[0].isIntersecting) return;
    cerca.disconnect();
    c.classList.add('espera');
    vueloCierre = new Image();
    vueloCierre.src = foto('mariposa');
    c.querySelector('.cierre-logo img').loading = 'eager';
  },{rootMargin:'500px 0px'});
  const llega = new IntersectionObserver(l=>{
    if(!l[0].isIntersecting) return;
    llega.disconnect();
    cierreHecho = true;
    animarCierre(c);
  },{threshold:.4});
  cerca.observe(c);
  llega.observe(c);
  vigias = [cerca,llega];
}
async function animarCierre(c){
  const logo = c.querySelector('.cierre-logo img');
  await logo.decode?.().catch(()=>{});
  const listo = await Promise.race([vueloCierre?.decode().then(()=>true,()=>false),new Promise(r=>setTimeout(()=>r(false),1800))]);
  if(!listo){
    c.classList.remove('espera');
    return logo.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 -4% 0 0)'}],{duration:1200,easing:SUAVE});
  }
  const W = c.clientWidth, a = c.getBoundingClientRect(), b = logo.getBoundingClientRect();
  const M = parseFloat(getComputedStyle(c).getPropertyValue('--mar'));
  const tx = b.left-a.left+b.width*.034, ty = b.top-a.top+b.height*.27, k = b.height*.4/(.6*M);
  const cx = W/2, cy = b.top-a.top+b.height*.25, rx0 = Math.min(W*.4,340);
  const suave = v => {v = Math.min(1,Math.max(0,v));return v*v*(3-2*v)};
  const mar = document.createElement('img');
  mar.className = 'cierre-mariposa';
  mar.alt = '';
  mar.src = vueloCierre.src;
  c.appendChild(mar);
  const N = 84, cuadros = [], ruta = [];
  for(let i=0;i<=N;i++){
    const t = i/N, g = -Math.PI*.95+t*Math.PI*2*2.25, rx = rx0*(1-.42*t);
    const x0 = cx+Math.cos(g)*rx, y0 = cy+Math.sin(g)*rx*.42, e0 = (1+.34*Math.sin(g))*(1-.2*t);
    const entra = suave(t/.14), posa = suave((t-.78)/.22);
    const x1 = -M+(x0+M)*entra, x = x1+(tx-x1)*posa, y = y0+(ty-y0)*posa, e = e0+(k-e0)*posa;
    ruta.push([x,y,t]);
    cuadros.push({transform:`translate(${x-.5*M*e}px,${y-.55*M*e}px) rotate(${(-Math.cos(g)*16*(1-posa)).toFixed(1)}deg) scale(${e.toFixed(3)})`});

/* Fotos automáticas de Amazon: apagadas. Amazon pide 10 ventas en 30 días, y la API tiene que ser de la cuenta de ella.
   Cuando tenga su servidor, su dirección va en apiFotos y se enciende sola. Esa dirección recibe ?link= y responde
   {nombre,fotos:[...]}. Amazon no deja guardar sus imágenes ni recortarlas: solo sus direcciones hasta 24 horas. */
const CONFIG = {apiFotos:'',demo:true,entrar:''};
const MAX_FOTOS = 8;
const pedirAmazon = async link => {
  const r = await fetch(`${CONFIG.apiFotos}?link=${encodeURIComponent(link)}`);
  if(!r.ok) throw new Error('sin respuesta');

};

  const viejos = Object.values(datos.productos).filter(p=>p.link&&!p.fotos?.length&&Date.now()-(p.amazon?.cuando||0)>864e5);

/* Links: ella pega y lo demás sale solo */
const TIENDA = /^(www\.|smile\.)?amazon\.(com|ca|com\.mx|com\.br|co\.uk|es|de|fr|it|co\.jp|com\.au|in|nl|pl|se|sg|ae|sa|eg|com\.be|com\.tr)$/i;
const CORTO = /^(amzn\.to|amzn\.eu|amzn\.asia|a\.co)$/i;
function revisarLink(v){
  v = v.trim();
  if(!v) return {error:'Pega el link de Amazon.'};
  let u;
  try{u = new URL(v)}catch(e){u = null}
  const tienda = u&&TIENDA.test(u.hostname);
  if(!u||u.protocol!=='https:'||!(tienda||CORTO.test(u.hostname))) return {error:'Ese link no es de Amazon.'};
  if(/^a\.co$/i.test(u.hostname)) return {error:'Este link no lleva tu código y no daría comisión. Cópialo desde la barra de afiliados de Amazon.'};
  if(CORTO.test(u.hostname)) return {aviso:'Este link corto da comisión, pero no entra en «Todo al carrito». Para el Kit usa el link completo.'};
  if(tienda&&!u.searchParams.get('tag')&&!datos.marca.tag) return {aviso:'Escribe tu código de afiliada una vez y lo pongo solo en todos tus links.',pideCodigo:true};
  return {};
}
const asinDe = v => (String(v).match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([A-Z0-9]{10})(?=[/?#]|$)/i)||[])[1]?.toUpperCase()||'';
/* Deja el link limpio y siempre con su código. Lo aprende del primer link; después el suyo manda sobre el de otra persona */
function limpiarLink(v){
  v = v.trim();
  try{
    const u = new URL(v);
    if(!TIENDA.test(u.hostname)) return v;
    const t = u.searchParams.get('tag');
    if(t&&!datos.marca.tag){
      datos.marca.tag = t;
      avisar(`Guardé tu código: ${t}. Si no es el tuyo, cámbialo en tu logo.`);
    }
    const tag = datos.marca.tag, a = asinDe(u.pathname);
    const limpio = new URL(a?`https://${u.hostname}/dp/${a}`:u.href);
    if(tag) limpio.searchParams.set('tag',tag);
    return limpio.href;
  }catch(e){return v}
}
const yaEsta = link => {
  const a = asinDe(link);
  return a?Object.keys(datos.productos).find(k=>asinDe(datos.productos[k].link||'')===a):'';
};
function ponerEn(d,pid){
  const [t,k] = d.split(':');
  const c = t==='c'&&datos.categorias[k];
  if(c){
    c.productos.push(pid);
    if(!c.foto) c.foto = datos.productos[pid].foto;
    return;
  }
  (datos.secciones.find(s=>s.id===k)||datos.secciones[0]).piezas.push({t:'prod',id:pid});
}
/* Copiar en Amazon, tocar Agregar link y ya */
function guardarRapido(link){
  if(yaEsta(link)) return avisar('Ese producto ya está en tu página.');
  recordar();
  const pid = id(), nombre = nombreDelLink(link);
  datos.productos[pid] = {nombre,link:limpiarLink(link),foto:'',fotos:[],creado:Date.now()};
  ponerEn(ultimoDestino,pid);
  refrescar();
  avisarDeshacer(`Agregado: ${nombre.slice(0,26)}`);
}
function nombreDelLink(v){
  try{
    const p = new URL(v.trim()).pathname.split('/').filter(Boolean);
    const i = p.findIndex(x=>x==='dp'||x==='gp');
    const t = i>0?p[i-1]:'';
    if(!t) return '';
    const txt = decodeURIComponent(t).replace(/[-_]+/g,' ').trim().split(' ').slice(0,7).join(' ');
    return txt.charAt(0).toUpperCase()+txt.slice(1);
  }catch(e){return ''}
}
async function comprimir(archivo,lado=1000,transparente=false){
  const url = URL.createObjectURL(archivo);
  const im = new Image();
  im.src = url;
  await im.decode();
  const k = Math.min(1,lado/Math.max(im.naturalWidth,im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth*k);
  c.height = Math.round(im.naturalHeight*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  return transparente?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82);
}

  flujo = {tipo:'producto',pid,destino,link:p.link||'',nombre:p.nombre||'',fotos:[...(p.fotos?.length?p.fotos:p.foto?[p.foto]:[])],amazon:p.amazon,grupo:p.grupo,esencial:p.esencial,creado:p.creado};

function mirarLink(){
  const c = $('#p-link');
  if(!c) return;
  const r = c.value.trim()?revisarLink(c.value):{};
  const a = $('#p-aviso');
  a.hidden = !r.aviso;
  a.textContent = r.aviso||'';
  const pc = $('#p-codigo');
  if(pc) pc.hidden = !r.pideCodigo;
  const n = $('#p-nombre');

/* Ordenar con el dedo */
function prepararOrden(){
  document.querySelectorAll('.asa').forEach(a=>{
    a.onpointerdown = ev => {
      ev.preventDefault();
      const fila = a.closest('.renglon');
      const lista = fila.parentElement;
      fila.classList.add('arrastrando');
      a.setPointerCapture(ev.pointerId);
      let y0 = ev.clientY;
      a.onpointermove = m => {
        const dy = m.clientY-y0;
        fila.style.transform = `translateY(${dy}px)`;
        const her = dy>0?fila.nextElementSibling:fila.previousElementSibling;
        if(her){
          const q = her.getBoundingClientRect(), c = fila.getBoundingClientRect();
          if(dy>0&&c.top+c.height/2>q.top+q.height/2){lista.insertBefore(her,fila);y0+=q.height;fila.style.transform=`translateY(${m.clientY-y0}px)`}
          if(dy<0&&c.top+c.height/2<q.top+q.height/2){lista.insertBefore(fila,her);y0-=q.height;fila.style.transform=`translateY(${m.clientY-y0}px)`}
        }
      };
      a.onpointerup = () => {
        a.onpointermove = a.onpointerup = null;
        fila.classList.remove('arrastrando');
        fila.style.transform = '';
        const orden = [...lista.children].map(f=>+f.dataset.i);
        aplicarOrden(lista.dataset.orden,orden);
      };
    };
  });
}
function aplicarOrden(destino,orden){
  const [t,k] = destino.split(':');
  const arr = t==='s'?datos.secciones.find(s=>s.id===k).piezas:datos.categorias[k].productos;
  const nuevo = orden.map(i=>arr[i]);
  arr.splice(0,arr.length,...nuevo);
  refrescar();
  const dibuja = {s:hojaSeccion,c:hojaCategoria}[t];
  dibuja(k);
}
function nombrePieza(p){
  if(p.t==='prod') return [datos.productos[p.id]?.nombre,datos.productos[p.id]?.foto];
  const c = datos.categorias[p.id];
  return p.t==='videos'?['Videos',c?.anteriores[0]?.foto]:[c?.titulo,c?.foto];
}

    filtrarKit();
  },
  kitCarrito(a,el){
    if(!el.hasAttribute('href')) avisar('Demo: aquí se abriría el carrito de Amazon.');
  },
  verAuto(){
    leerProducto();
    const c = $('#p-auto');
    c.className = 'auto buscando';
    c.innerHTML = '<b>Buscando en Amazon…</b><i class="barrita"></i>';
    setTimeout(()=>{
      if(flujo?.tipo!=='producto'||!$('#p-link')) return;
      leerProducto();
      flujo.fotos = [foto('tenis-2'),foto('tenis')];
      flujo.nombre = flujo.nombre||'Tenis blancos';
      flujo.simulado = true;
      hoja(formProducto());
      mirarLink();
    },1200);
  }
};
const EDITABLES = {
  logo(){const m=datos.marca;flujo={tipo:'logo'};hoja(`<h3>Tu logo</h3><div class="campo"><span class="rotulo">Icono</span>${campoFoto(m.logo,'data-foto="logo"','Elegir imagen')}</div><div class="campo"><span class="rotulo">Logo de la entrada</span>${campoFoto(m.logoEntrada,'data-foto="entrada"','Elegir imagen')}</div><div class="campo"><label for="l-letra">O una letra</label><input id="l-letra" maxlength="2" value="${esc(m.letra)}"></div><div class="campo"><label for="l-nombre">Tu nombre</label><input id="l-nombre" maxlength="40" value="${esc(m.nombre)}"></div><div class="campo"><label for="l-tag">Tu código de afiliada</label><input id="l-tag" autocomplete="off" autocapitalize="off" placeholder="tunombre-20" value="${esc(m.tag||'')}"></div><button class="primario" data-acc="guardarLogo">Guardar</button>${matchMedia('(display-mode:standalone)').matches?'':'<button class="secundario ancho" data-acc="instalarApp">Instalar como app</button>'}<button class="secundario ancho" data-acc="cerrarAparato">Cerrar en este aparato</button>${m.logoEntrada?'<button class="secundario ancho peligro" data-acc="quitarEntrada">Quitar logo de la entrada</button>':''}${m.logo?'<button class="secundario ancho peligro" data-acc="quitarLogo">Quitar icono</button>':''}`)},
  foto(){flujo={tipo:'fotoElla'};hoja(`<h3>Tu foto</h3>${campoFoto(datos.marca.foto,'data-foto="ella"')}${datos.marca.foto?'<button class="secundario ancho peligro" data-acc="quitarFotoElla">Quitar foto</button>':''}`)},
  gancho(){hoja(`<h3>Tus frases</h3><div class="campo"><label for="g-barra">Barra de arriba</label><input id="g-barra" maxlength="60" value="${esc(datos.marca.barra||'')}"></div><div class="campo"><label for="g-texto">Debajo de tu nombre</label><textarea id="g-texto" maxlength="60">${esc(datos.marca.gancho)}</textarea></div><button class="primario" data-acc="guardarGancho">Guardar</button>`)},
  boton(){const b=datos.marca.boton;hoja(`<h3>Botón de arriba</h3><div class="campo"><label for="b-link">Link de tu app de reservas</label><input id="b-link" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://" value="${esc(b.link)}"></div><div class="campo"><label for="b-texto">Texto del botón</label><input id="b-texto" maxlength="16" value="${esc(b.texto)}"></div><p class="error" id="b-error" hidden></p><button class="primario" data-acc="guardarBoton">${b.activo?'Guardar':'Poner botón'}</button>${b.activo?'<button class="secundario ancho peligro" data-acc="quitarBoton">Quitar botón</button>':''}`)}
};

document.addEventListener('click',e=>{
  const c = e.target.closest('[data-acc],[data-ed],[data-pieza],[data-vista-sec],[data-vista-cat],[data-vista-nueva],[data-tipo-cat],[data-elegir]');
  if(!c) return;
  const d = c.dataset;
  if(editando&&d.ed){
    e.preventDefault();
    const [t,k] = d.ed.split(':');
    if(t==='seccion') return hojaSeccion(k);
    return EDITABLES[t]();
  }
  if(editando&&'pieza' in d){
    e.preventDefault();
    if(d.prod) return abrirProducto(d.prod);
    const pz = d.sec?datos.secciones.find(s=>s.id===d.sec).piezas[+d.i]:null;
    if(pz?.t==='cat') return hojaCategoria(pz.id);
    if(pz?.t==='videos') return location.hash=`v/${pz.id}`;
    if(pz?.t==='prod') return abrirProducto(pz.id);
    return;
  }
  if('pieza' in d&&c.href&&!d.prod){
    const im = c.querySelector('.marco img');
    if(im) im.parentElement.style.viewTransitionName = 'foto-grande';
  }
  if(d.acc) return ACCIONES[d.acc](d.arg,c);
  if(d.vistaSec){const s=datos.secciones.find(x=>x.id===flujo.sid);s.vista=d.vistaSec;refrescar();return hojaSeccion(s.id)}
  if(d.vistaCat){datos.categorias[flujo.cid].vista=d.vistaCat;refrescar();return hojaCategoria(flujo.cid)}
  if(d.vistaNueva){flujo.vista=d.vistaNueva;flujo.tipo==='nuevaCat'?pasoCategoria():pasoSeccion();return}
  if(d.tipoCat){flujo.inteligente=d.tipoCat==='inteligente';flujo.paso=3;return pasoCategoria()}
  if(d.elegir){
    const on = flujo.sel.includes(d.elegir);
    flujo.sel = on?flujo.sel.filter(x=>x!==d.elegir):[...flujo.sel,d.elegir];
    c.setAttribute('aria-pressed',!on);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='p-link') mirarLink();
  if(e.target.id==='s-titulo'){datos.secciones.find(x=>x.id===flujo.sid).titulo=e.target.value;guardar();pintar()}
  if(e.target.id==='kit-busca'){kitTexto = e.target.value;return filtrarKit()}
  if(e.target.id==='v-link') return mirarLinkVideo(false);
  if(e.target.id==='c-frase'){datos.categorias[flujo.cid].frase=e.target.value;guardar();pintar()}
  if(e.target.id==='c-titulo'){datos.categorias[flujo.cid].titulo=e.target.value;guardar();pintar()}
});
document.addEventListener('change',async e=>{
  const marcado = e.target.dataset?.kit;
  if(marcado){
    e.target.checked?kitSel.add(marcado):kitSel.delete(marcado);
    return marcarKit();
  }
  const quien = e.target.dataset?.foto;
  const a = e.target.files?.[0];
  if(!quien||!a) return;
  const resto = [...e.target.files].slice(1,MAX_FOTOS);
  try{
    const marca = quien==='logo'||quien==='entrada';
    const f = await comprimir(a,quien==='logo'?512:1000,marca);
    const todas = [f,...await Promise.all(resto.map(x=>comprimir(x)))];
    if(quien==='rapida'){
      const obj = e.target.dataset.obj, [t,k] = obj.split(':');
      const antes = e.target.closest('.caja').querySelector('.marco img')?.getAttribute('src');
      recordar();
      if(t==='p'){datos.productos[k].foto = f;datos.productos[k].fotos = todas}
      if(t==='c') datos.categorias[k].foto = f;
      if(t==='v') datos.categorias[k].portadaVideos = f;
      guardar();
      pintar();
      mostrarCambio(obj,antes);
      return avisarDeshacer(todas.length>1?`${todas.length} fotos puestas`:'Foto cambiada');
    }
    if(quien==='producto'){leerProducto();flujo.fotos=[...flujo.fotos,...todas].slice(0,MAX_FOTOS);hoja(formProducto());mirarLink();return}
    if(quien==='categoria'){datos.categorias[flujo.cid].foto=f;refrescar();return hojaCategoria(flujo.cid)}
    if(quien==='ella'){datos.marca.foto=f;refrescar();return EDITABLES.foto()}
    if(quien==='logo'){datos.marca.logo=f;refrescar();return EDITABLES.logo()}
    if(quien==='entrada'){datos.marca.logoEntrada=f;refrescar();return EDITABLES.logo()}
  }catch(err){avisar('No se pudo abrir esa foto. Prueba con otra.')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') cerrarHoja();
  if(e.key==='Enter'&&e.target.matches?.('.pieza[role=button]')) e.target.click();
});
/* Fotos: siguen al dedo; con un deslizamiento corto ya cambian */
function irAFoto(t,i){
  i = Math.max(0,Math.min(t.children.length-1,i));
  t.dataset.i = i;
  t.style.transition = '';
  t.style.transform = `translate3d(${-i*100}%,0,0)`;
}
let arrastre = null, saltarClic = false;
document.addEventListener('pointerdown',e=>{
  const t = e.target.closest?.('.marco.varias')?.querySelector('.tira');
  if(!t||e.button) return;
  arrastre = {t,id:e.pointerId,x:e.clientX,y:e.clientY,i:+t.dataset.i||0,w:t.clientWidth,n:t.children.length,hora:e.timeStamp,dx:0,va:false};
});
window.addEventListener('pointermove',e=>{
  const a = arrastre;
  if(!a||e.pointerId!==a.id) return;
  const dx = e.clientX-a.x, dy = e.clientY-a.y;
  if(!a.va){
    if(Math.abs(dx)<5&&Math.abs(dy)<5) return;
    if(Math.abs(dy)>Math.abs(dx)){arrastre = null;return}
    a.va = true;
    a.t.style.transition = 'none';
    try{a.t.setPointerCapture(e.pointerId)}catch(x){}
  }
  a.dx = dx;
  const borde = (a.i===0&&dx>0)||(a.i===a.n-1&&dx<0);
  a.t.style.transform = `translate3d(${-a.i*a.w+(borde?dx*.3:dx)}px,0,0)`;
});
function soltarFoto(e){
  const a = arrastre;
  if(!a||e.pointerId!==a.id) return;
  arrastre = null;
  if(!a.va) return;
  const rapido = Math.abs(a.dx)/Math.max(1,e.timeStamp-a.hora)>.3;
  irAFoto(a.t,a.i+(Math.abs(a.dx)>a.w*.15||rapido?(a.dx<0?1:-1):0));
  saltarClic = true;
  setTimeout(()=>{saltarClic = false},350);
}
window.addEventListener('pointerup',soltarFoto);
window.addEventListener('pointercancel',soltarFoto);
document.addEventListener('click',e=>{
  if(saltarClic){
    saltarClic = false;
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  const f = e.target.closest?.('[data-mover]');
  if(!f) return;
  e.preventDefault();
  e.stopPropagation();
  const t = f.closest('.marco').querySelector('.tira');
  irAFoto(t,(+t.dataset.i||0)+ +f.dataset.mover);
},true);
/* Solo el link privado abre el editor. Cualquier otra dirección no hace nada */
async function abrirEditor(){
  const h = location.hash.slice(1);
  if(!CONFIG.entrar||!h.startsWith('e-')||await resumen(h)!==CONFIG.entrar) return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash = ''}
  editando = soyDuena();
  pintar();
  if(!editando) pedirClave();
}
/* Al volver de una categoría, la página queda donde estaba */
let posInicio = 0;
window.addEventListener('hashchange',e=>{
  abrirEditor();
  const a = new URL(e.oldURL||location.href).hash, n = location.hash;
  if(a.length<2&&n.length>1) posInicio = window.scrollY;
  transicion(()=>{
    pintar();
    window.scrollTo({top:n.length<2?posInicio:0,behavior:'instant'});
  });
});
window.addEventListener('resize',prepararCarruseles);
window.addEventListener('resize',medirAncho);

/* El teclado del teléfono no tapa la hoja */
window.visualViewport?.addEventListener('resize',()=>{
  const v = window.visualViewport, t = Math.max(0,innerHeight-v.height-v.offsetTop);
  document.documentElement.style.setProperty('--teclado',`${Math.round(t)}px`);
});

/* Arrastrar la hoja hacia abajo la cierra */
(()=>{
  const a = $('#asa-hoja'), h = $('#hoja');
  a.onpointerdown = ev => {
    a.setPointerCapture(ev.pointerId);
    const y0 = ev.clientY;
    h.style.transition = 'none';
    a.onpointermove = m => {h.style.transform = `translate(-50%,${Math.max(0,m.clientY-y0)}px)`};
    a.onpointerup = m => {
      a.onpointermove = a.onpointerup = null;
      h.style.transition = '';
      h.style.transform = '';
      if(m.clientY-y0>90) cerrarHoja();
    };
  };
})();

/* App instalable: solo donde la página está publicada */

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();avisoInstalar = e});
if($('link[rel=manifest]')) navigator.serviceWorker?.register('sw.js').catch(()=>{});

abrirEditor();
pintar();
entrada().catch(()=>{$('.intro')?.remove();$('#antes')?.remove()});
refrescarAmazon();
